name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm i -g firebase-tools@15
      - run: firebase emulators:exec --only firestore "npm run test:rules"
        working-directory: ${{ github.workspace }}
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
